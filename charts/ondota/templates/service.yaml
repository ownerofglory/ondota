apiVersion: v1
kind: Service
metadata:
  name: {{ include "ondota.fullname" . }}
  labels:
    {{- include "ondota.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "ondota.selectorLabels" . | nindent 4 }}
  ports:
    - name: public
      port: {{ .Values.service.publicPort }}
      targetPort: public
    - name: device
      port: {{ .Values.service.devicePort }}
      targetPort: device
