name: Pull request checks

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -path './bin/*'))
          if [ -n "$unformatted" ]; then
            echo "Not gofmt formatted:"; echo "$unformatted"; exit 1
          fi
      - run: make vet
      - run: make coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  build:
    name: Build and chart lint
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: azure/setup-helm@v4
      - run: make build
      - run: make helm-lint
      - run: make helm-template
      - name: Docker build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  integration:
    name: Integration tests
    needs: test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ondota_test
          POSTGRES_USER: ondota
          POSTGRES_PASSWORD: ondota
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ondota -d ondota_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-integration
        env:
          TEST_DATABASE_URL: postgres://ondota:ondota@localhost:5432/ondota_test?sslmode=disable
